services:
  db:
    image: postgres:16
    # Back by itself whenever Docker starts (e.g. after a PC restart): the private instance needs it.
    # Here, not in the private override, so `make db` and the private compose agree and neither
    # recreates the container to change it.
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-swave}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-swave}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    shm_size: 1g
    # Tuned for bulk loads on a local, single-user, rebuildable database (no replication).
    command: >
      postgres
      -c shared_buffers=1GB
      -c work_mem=64MB
      -c maintenance_work_mem=1GB
      -c max_wal_size=8GB
      -c wal_level=minimal
      -c max_wal_senders=0
      -c synchronous_commit=off
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
