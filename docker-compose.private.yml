# Private Swave for the owner + friends, served from this PC through a Cloudflare Tunnel.
# Production builds (next build + standalone server; uvicorn without --reload).
#
#   docker compose -f docker-compose.yml -f docker-compose.private.yml --env-file .env.private up -d --build
#   (or: make private-up / private-down / private-logs / private-update)
#
# Nothing is published on the PC's ports: the only way in is the tunnel, and Cloudflare Access
# (one-time PIN email login, allowlist) sits in front of it. The API verifies the Access JWT on
# every request too (SWAVE_REQUIRE_ACCESS=1), so a request that bypassed Cloudflare is refused.
# Same `db` container as development, but its OWN database `swave_private` (role swave_private,
# which cannot connect to the dev database `swave`): user data + caches + a copy of the music
# index, refreshed only by `make private-index-sync`.

services:
  api:
    build:
      context: ./api
      args:
        SWAVE_GIT: ${SWAVE_GIT:-unknown}  # set by make private-deploy
    restart: unless-stopped
    env_file: .env.private
    environment:
      # its own database + non-superuser role (scripts/private-db-setup.ps1); dev stays on `swave`
      DATABASE_URL: postgresql://swave_private:${PRIVATE_DB_PASSWORD:?set PRIVATE_DB_PASSWORD in .env.private}@db:5432/swave_private
      SWAVE_MODE: personal
      SWAVE_REQUIRE_ACCESS: "1"
      SWAVE_SCORERS: /app/scorers.json
    volumes:
      - ./scorers.json:/app/scorers.json:ro   # live weights, unchanged from development
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: /api
    restart: unless-stopped
    depends_on:
      - api

  cloudflared:
    # Remote-managed named tunnel: its routes (/api/* → api:8000, everything else → web:3000)
    # are set in the Cloudflare dashboard; this container only needs the tunnel token.
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    restart: unless-stopped
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN in .env.private}
    depends_on:
      - web
      - api
