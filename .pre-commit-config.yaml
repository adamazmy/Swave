# Public repo guard rails. Install with `make setup` (runs `pre-commit install`).
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=5120, --enforce-all]   # reject any staged file over 5 MB
      - id: detect-private-key

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]

  - repo: local
    hooks:
      - id: forbid-dataset-and-secrets
        name: Block dataset files, derived data and .env files
        language: fail
        entry: "Refusing to commit dataset / derived data / .env files (see CLAUDE.md, Public repo rules)"
        files: '(^|/)(data|exports|dumps)/|(^|/)\.env($|\.(?!example$))|mpd\.slice\.|\.(npz|npy|parquet|pkl|dump|sql\.gz)$'
