[project]
name = "swave"
version = "0.1.0"
description = "Personal playlist builder: item-item co-occurrence recommender"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0",
  "scipy>=1.13",
  "pandas>=2.2",
  "psycopg[binary,pool]>=3.2",
  "python-dotenv>=1.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pre-commit>=3.7", "detect-secrets>=1.5"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["swave*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
